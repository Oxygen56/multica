name: Sync Upstream → Build → Push GHCR

on:
  schedule:
    # Daily at UTC 4:00 (Beijing 12:00)
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Skip upstream sync (build from current HEAD)"
        type: boolean
        default: false
  # Auto-trigger when CI passes on main — no manual step needed.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: oxygen56

jobs:
  # ── Job 1: Sync from upstream ──────────────────────────────────────────
  sync-upstream:
    runs-on: ubuntu-latest
    # Skip when triggered by workflow_run (CI already ran on latest) or
    # when the user chose to skip sync via workflow_dispatch.
    if: |
      github.event_name != 'workflow_run' &&
      (github.event_name != 'workflow_dispatch' || !inputs.skip_sync)
    permissions:
      contents: write
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream main
        id: sync
        run: |
          git remote add upstream https://github.com/multica-ai/multica.git
          git fetch upstream main

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          FORK_SHA=$(git rev-parse origin/main)
          echo "upstream_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          echo "fork_sha=${FORK_SHA}" >> $GITHUB_OUTPUT

          if [ "${UPSTREAM_SHA}" = "${FORK_SHA}" ]; then
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Already in sync — upstream main == fork main (${FORK_SHA:0:8})"
            exit 0
          fi

          git merge upstream/main -m "Merge upstream/main"
          git push origin main
          echo "synced=true" >> $GITHUB_OUTPUT
          echo "Merged upstream ${UPSTREAM_SHA:0:8} → fork ${FORK_SHA:0:8}"

  # ── Job 2: Build & push Docker images ──────────────────────────────────
  build-push:
    needs: sync-upstream
    # Build when:
    #   - workflow_dispatch (manual trigger)
    #   - workflow_run with CI success
    #   - schedule with upstream changes
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        needs.sync-upstream.result == 'skipped' ||
        needs.sync-upstream.outputs.synced == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: multica-backend
            dockerfile: Dockerfile
            context: .
          - image: multica-web
            dockerfile: Dockerfile.web
            context: .
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.IMAGE_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Trigger ECS deploy ─────────────────────────────────────────
  deploy-ecs:
    needs: build-push
    if: |
      always() &&
      needs.build-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          script: |
            cd /opt/multica
            docker compose -f docker-compose.selfhost.yml pull
            docker compose -f docker-compose.selfhost.yml up -d --remove-orphans
            echo "Deploy complete — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
